name: Apply temporary video fix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-video-fix.yml"
      - ".github/scripts/apply-video-fix.py"

permissions:
  contents: write

jobs:
  apply-video-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply the five targeted HTML changes
        run: python3 .github/scripts/apply-video-fix.py

      - name: Verify patch and commit the production HTML
        run: |
          git diff --check
          rm .github/scripts/apply-video-fix.py
          rm .github/workflows/apply-video-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix video playback and audio handling"
          git push origin HEAD:main
